[project]
name = "pathforge-ai-backend"
version = "1.0.0"
description = "PathForge AI FastAPI service"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "email-validator>=2.2",
  "fastapi>=0.115,<0.120",
  "httpx>=0.28",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0,<4.1",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "PyJWT>=2.10",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

